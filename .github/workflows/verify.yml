name: Verificar app React
on:
  push:
    branches: [V2Camion]
    paths: ['app/**', '.github/workflows/**']
  pull_request:
    paths: ['app/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run release:check && npm run format:check && npm audit --audit-level=moderate && npm test && npm run test:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui && npm run test:offline && npm run build
